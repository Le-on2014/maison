# Construit l'image multi-arch (armv7 pour le Sonoff iHost + amd64 pour tester sur PC) et la pousse sur GHCR.
#
# IMPORTANT : apres le 1er build, rendre le paquet PUBLIC pour que l'iHost puisse le tirer sans identifiants :
#   GitHub -> ta page de profil -> Packages -> maison -> Package settings -> Danger Zone -> Change visibility -> Public
#   (l'image ne contient aucun secret : voir .dockerignore ; les secrets arrivent par variables d'environnement)
name: Build & push image maison

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '*.ps1'
      - '*.psm1'
      - '*.cmd'
      - '*.vbs'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (emulation arm/v7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (optionnel) : l'iHost ne sait lire que Docker Hub, pas GHCR.
      # Secrets a creer dans le depot GitHub : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'acces Read/Write).
      - name: Login Docker Hub
        if: ${{ env.DH_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR exige un nom en minuscules : Le-on2014 -> ghcr.io/le-on2014/maison
      - name: Noms de l'image
        id: img
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maison"
          echo "name=$ghcr" >> "$GITHUB_OUTPUT"
          tags="$ghcr:latest"$'\n'"$ghcr:sha-${GITHUB_SHA}"
          if [ -n "$DH_USER" ]; then
            dh="docker.io/${DH_USER,,}/maison"
            tags="$tags"$'\n'"$dh:latest"$'\n'"$dh:sha-${GITHUB_SHA}"
            echo "dockerhub=$dh" >> "$GITHUB_OUTPUT"
          fi
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/amd64
          push: true
          # provenance/sbom desactives : evite les manifestes "unknown/unknown" que certains Docker embarques digerent mal
          provenance: false
          sbom: false
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resume
        run: |
          echo "Image GHCR : ${{ steps.img.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.img.outputs.dockerhub }}" ]; then echo "Image Docker Hub : ${{ steps.img.outputs.dockerhub }}:latest (a utiliser dans l'iHost)" >> "$GITHUB_STEP_SUMMARY"; else echo "Docker Hub non configure (secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents)." >> "$GITHUB_STEP_SUMMARY"; fi
